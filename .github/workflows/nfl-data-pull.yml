name: NFL Data Pull

on:
  schedule:
    # The NFL pages mirror JSON built in pjmerica/AI_Agent_work. Cadence follows
    # how the upstream data actually moves, which is uneven across the week:
    #
    #   Tue/Wed  the slate rolls over; books have posted almost nothing for
    #            Sunday yet (a Wednesday pull of week 3 had 10 of 16 games)
    #   Thu      sportsbooks open the Sunday props overnight -- the single
    #            biggest jump of the week (99 -> 183 player-games in week 3)
    #   Fri/Sat  coverage fills in and lines move
    #   Sun      closing lines, which are the ones that matter
    #
    # So: twice daily Thursday through Sunday, once a day Monday to Wednesday.
    # Times are UTC; 13:20 UTC is 9:20am ET, well before any 1pm ET kickoff.
    # Not on the hour: GitHub's scheduler is congested at :00 and queues runs
    # for minutes. The repo's other workflows use :30 and :45 for the same
    # reason, and the three are staggered so they do not race each other.
    # Timed to follow the UPSTREAM refresh, which is the whole point of a mirror.
    # Upstream (pjmerica/AI_Agent_work, nfl-props.yml) refreshes at 02:00, 14:00,
    # 19:00 and 23:00 UTC. This used to run at 13:20 -- forty minutes BEFORE the
    # 14:00 upstream slot -- so it always pulled the previous cycle and the site
    # sat a cycle behind: 100 player-games here against 302 upstream, with both
    # workflows green.
    #
    # Exact offsets cannot be relied on: GitHub queues free-tier cron heavily
    # (measured on this account, a median of ~4.5 hours late and worst overnight),
    # so each slot is just placed comfortably after its upstream counterpart. The
    # puller is idempotent and commits only when bytes actually change, so a run
    # that lands early is a no-op rather than a problem.
    - cron: '0 4 * * *'        # after upstream's 02:00 (Wed-night props opening)
    - cron: '0 16 * * *'       # after upstream's 14:00
    - cron: '0 21 * * 4,5,6,0' # after upstream's 19:00, Thu-Sun only
    - cron: '0 1 * * 5,6,0,1'  # after upstream's 23:00, next day UTC
  workflow_dispatch:

jobs:
  pull:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      # Mirrors the already-built JSON rather than running the scrapers again.
      # The Odds API bills per event per market, so a second pipeline would
      # double the credit burn for identical numbers -- and no ODDS_API_KEY has
      # to exist in this repo at all. See scripts/pull_nfl_data.py.
      - name: Pull NFL market data
        run: python scripts/pull_nfl_data.py

      - name: Commit and push if changed
        run: |
          git config user.name  "ezdubs-bot"
          git config user.email "ezdubs-bot@users.noreply.github.com"
          git add dashboards/nfl-start-sit/data/
          if git diff --cached --quiet; then
            echo "No new data to commit."
            exit 0
          fi
          # Pull the week out with grep rather than an interpreter. This runs
          # AFTER git add, so anything that can throw here would abort the step
          # with changes staged and nothing committed -- and an earlier attempt
          # at this with an inline `python -c` was itself broken: a multi-line
          # script indented inside a YAML block scalar is an IndentationError, so
          # the label would always have been "?". grep cannot fail that way; a
          # missing or malformed file yields no match and the default applies.
          WEEK=$(grep -o '"week"[[:space:]]*:[[:space:]]*[0-9]*' \
                   dashboards/nfl-start-sit/data/weekly.json 2>/dev/null \
                 | head -1 | grep -o '[0-9]*$')
          WEEK=${WEEK:-?}
          git commit -m "Auto: NFL week $WEEK data $(date -u +%Y-%m-%d)"
          # Retry with rebase: this races the ADP and pred-arbs workflows, and a
          # human pushing by hand. They touch different files but share a branch.
          #
          # The rebase can stop on a conflict in data/mirrored_at.json, which is
          # what killed the 2026-10-10 06:45 run: `git pull --rebase` leaves the
          # repo mid-rebase, so every later `git push` in this loop fails for a
          # new reason and all five attempts burn with no chance of succeeding.
          #
          # That file is a generated stamp recording the upstream lastUpdated
          # values; nothing reads it but this workflow, so a conflict in it holds
          # no information. Resolve it in favour of this run and carry on. Any
          # other conflicting path is deliberately left to fail, because that
          # would mean two runs disagreeing about real data.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $i."
              exit 0
            fi
            echo "Push attempt $i failed; rebasing on remote."

            # Never start an attempt from a half-finished rebase.
            git rebase --abort 2>/dev/null || true

            if ! git pull --rebase --autostash origin main; then
              # Still mid-rebase: see whether the only casualty is the stamp.
              CONFLICTS=$(git diff --name-only --diff-filter=U)
              echo "conflicted paths: ${CONFLICTS:-<none>}"
              if [ "$CONFLICTS" = "dashboards/nfl-start-sit/data/mirrored_at.json" ]; then
                echo "Stamp-file conflict only; taking this run's version."
                git checkout --ours dashboards/nfl-start-sit/data/mirrored_at.json 2>/dev/null \
                  || git checkout --theirs dashboards/nfl-start-sit/data/mirrored_at.json
                git add dashboards/nfl-start-sit/data/mirrored_at.json
                GIT_EDITOR=true git rebase --continue || git rebase --abort || true
              else
                echo "Conflict outside the stamp file; not resolving automatically." >&2
                git rebase --abort 2>/dev/null || true
              fi
            fi
          done
          echo "Push failed after 5 attempts." >&2
          exit 1
