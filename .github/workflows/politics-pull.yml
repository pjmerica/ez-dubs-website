name: Election Forecast Pull

# Scheduled cron disabled 2026-11-13: the forecast locked at 6 p.m. Eastern on
# Election Day (LOCK_AT in scripts/pull_politics.py), and since then every run
# installed Node and Chrome only to log "nothing to do", twelve times a day.
# The pages and data are the final forecast and stay as they are. A manual
# dispatch still works but writes nothing while the lock is in place. For a
# future election: move or remove LOCK_AT, then uncomment the schedule.
on:
  # schedule:
  #   # The Politics pages mirror the election forecast built in
  #   # pjmerica/polling-agg-2026, which refreshes its market prices every two
  #   # hours (:41 past odd UTC hours) and re-runs the model after its twice-daily
  #   # poll refresh. This runs every two hours in between. GitHub starts this
  #   # account's cron runs 1.5-4.5 hours late, so exact offsets do not matter;
  #   # a run that finds nothing new commits nothing. Not on the hour, where the
  #   # scheduler is busiest, and clear of the other workflows' :00/:30/:45.
  #   - cron: '20 */2 * * *'
  workflow_dispatch:
    inputs:
      wait_until:
        description: >-
          Optional ISO UTC time (e.g. 2026-11-03T22:58:00Z). The run sleeps until then before
          checking out and pulling, so one copy lands at a set minute; that is how the last
          copy before the 6 p.m. Election Day lock was taken (LOCK_AT in pull_politics.py).
        required: false
        default: ''

# One run at a time; a dispatch landing on a scheduled run would otherwise
# commit the same files twice and the second push's rebase would conflict.
# A waiting run (wait_until) has a group of its own, so the scheduled runs keep
# going while it sleeps; it checks out only after waking, so it starts from them.
concurrency:
  group: politics-pull${{ inputs.wait_until && '-timed' || '' }}
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write
    steps:
      # Before the checkout, so a run that sleeps for hours still starts from
      # the latest main. Jobs are capped at 6 hours, so wait_until must be
      # under about 5.5 hours away.
      - name: Wait until the set time
        if: inputs.wait_until != ''
        env:
          WAIT_UNTIL: ${{ inputs.wait_until }}
        run: |
          target=$(date -d "$WAIT_UNTIL" +%s) || { echo "Bad wait_until: $WAIT_UNTIL" >&2; exit 1; }
          left=$(( target - $(date +%s) ))
          echo "Waiting $left s, until $(date -u -d "@$target")."
          if [ "$left" -gt 0 ]; then sleep "$left"; fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      # The forecast map's link-preview image (og-map.png) is drawn in headless
      # Chrome by scripts/render_og_card.js, which pull_politics.py runs when
      # summary.json changes. Without these the old image stays (a warning).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - uses: browser-actions/setup-chrome@v1
        id: chrome

      # Copies the four data files and rebuilds the two pages from upstream's
      # published HTML (scripts/pull_politics.py explains why they are rebuilt,
      # not hand-made). It exits 1 when something could not be mirrored, but
      # whatever DID update is still committed: the data files keep refreshing
      # even if a page change upstream needs this script fixing first.
      - name: Pull the election forecast
        id: pull
        continue-on-error: true
        run: python scripts/pull_politics.py
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}

      - name: Commit and push if changed
        run: |
          git config user.name  "ezdubs-bot"
          git config user.email "ezdubs-bot@users.noreply.github.com"
          # plus the link-preview screenshots of the forecast page and the home page (and the
          # home page's og:image tag that names the new one)
          git add dashboards/politics-data/ dashboards/politics-map/ dashboards/politics-forecast/ assets/previews/ index.html
          if git diff --cached --quiet; then
            echo "No new forecast to commit."
            exit 0
          fi
          git commit -m "Auto: election forecast $(date -u +%Y-%m-%dT%H:%MZ)"
          # Retry with rebase: this shares main with the other data workflows and
          # with hand pushes. They touch different files.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $i."
              exit 0
            fi
            echo "Push attempt $i failed; rebasing on remote."
            git rebase --abort 2>/dev/null || true
            git pull --rebase --autostash origin main || git rebase --abort 2>/dev/null || true
          done
          echo "Push failed after 5 attempts." >&2
          exit 1

      # Red run when the mirror could not do everything, after committing
      # whatever it could, so a page that stopped rebuilding gets noticed.
      - name: Fail if the mirror reported a problem
        if: steps.pull.outcome == 'failure'
        run: |
          echo "pull_politics.py reported a problem; see the 'Pull the election forecast' step." >&2
          exit 1
