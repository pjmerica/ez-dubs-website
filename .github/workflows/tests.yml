name: Tests

# The NFL dashboards are plain static files with no build step, so nothing else
# would catch a broken page until someone loaded it. These tests parse the real
# markup with jsdom and click the real buttons.
#
# They also exist because the suite was unrunnable for a while without anyone
# noticing: jsdom was never declared as a dependency, so `require("jsdom")` only
# resolved by accident from a parent directory. Running it in CI, from a clean
# checkout, is what keeps that honest.
on:
  push:
    branches: [main]
    paths:
      - 'dashboards/**'
      - 'index.html'
      - 'contact.html'
      - 'scripts/verify_cdn_integrity.test.js'
      - 'scripts/verify_nfl_pages.test.js'
      - 'scripts/pull_nfl_data.py'
      - 'package.json'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  nfl-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      # No browser needed: it reads the markup. Cheap, so it runs first.
      - name: Verify CDN script integrity
        run: node scripts/verify_cdn_integrity.test.js

      - name: Verify the NFL dashboards
        run: node scripts/verify_nfl_pages.test.js

      # jsdom does not enforce CSP, so the suite above cannot tell whether the
      # policy breaks the pages. This loads them in real Chrome and fails on any
      # violation.
      #
      # Chrome is installed explicitly rather than assumed at a path: the test
      # SKIPS when the binary is missing, so a wrong guess would quietly verify
      # nothing and still report success.
      - uses: browser-actions/setup-chrome@v1
        id: chrome

      - name: Verify the Content-Security-Policy
        run: node scripts/verify_csp.test.js
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}

      # Measures every page at 390, 360 and 320px inside an iframe, because
      # headless Chrome clamps --window-size to a 500px minimum viewport and both
      # layout bugs found here were invisible at 500px.
      - name: Check mobile layout at phone widths
        run: node scripts/verify_mobile_layout.test.js
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
